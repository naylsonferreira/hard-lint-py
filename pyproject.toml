[project]
name = "hard-lint-py"
version = "0.1.0"
description = "Rigorous linting and code quality setup for Python projects with pre-commit hooks"
authors = [
    {name = "Naylson Ferreira", email = "naylsonfsa@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["linting", "pre-commit", "code-quality", "ruff", "black", "isort", "commitlint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/naylsonferreira/hard-lint-py"
Repository = "https://github.com/naylsonferreira/hard-lint-py.git"
Issues = "https://github.com/naylsonferreira/hard-lint-py/issues"

[project.scripts]
hard-lint-py = "hard_lint_py.cli:main"

[tool.poetry]
packages = [{include = "hard_lint_py", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
ruff = "^0.1.0"
black = "^23.0.0"
isort = "^5.12.0"
pre-commit = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
mypy = "^1.5.0"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "C", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/hard_lint_py --cov-report=term-only"

[tool.mypy]
python_version = "3.10"
strict = true

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
